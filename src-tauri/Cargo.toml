[package]
name = "eroge-playtime-tracker"
version = "0.1.17"
description = "Foreground-aware visual novel playtime tracker"
authors = ["Eroge Playtime Tracker contributors"]
edition = "2024"
license = "MIT"

[lib]
name = "eroge_playtime_tracker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.4", features = [] }

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
directories = "6.0"
image = "0.25"
log = "0.4"
ort = "=2.0.0-rc.12"
paddleocr_rs_onnx = "=0.2.7"
parking_lot = "0.12"
# The updater shares hyper-util's system proxy support with this client.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "system-proxy"] }
rusqlite = { version = "0.37", features = ["bundled", "chrono"] }
scraper = "0.24"
semver = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2.8", features = ["tray-icon", "protocol-asset"] }
tauri-plugin-autostart = "2.5"
tauri-plugin-dialog = "2.4"
tauri-plugin-log = "2.7"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
thiserror = "2"
tokio = { version = "1", features = ["rt", "time", "sync"] }
url = "2.5"
png = "0.17"
zip = { version = "8.3", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_System_LibraryLoader", "Win32_UI_HiDpi", "Win32_Storage_Xps", "Win32_System_Diagnostics_ToolHelp", "Win32_System_ProcessStatus", "Win32_System_Threading", "Win32_UI_Accessibility", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tauri = { version = "2.8", features = ["test"] }

[target.'cfg(windows)'.dev-dependencies]
windows = { version = "0.61", features = ["Win32_System_Registry"] }
windows-registry = "0.6"
